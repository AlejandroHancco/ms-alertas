services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: upgrade_ms
      POSTGRES_PASSWORD: upgrade_ms
      POSTGRES_DB: upgrade_ms
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upgrade_ms -d upgrade_ms"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: upgrade_ms
      PGPASSWORD: upgrade_ms
      PGDATABASE: upgrade_ms
      PGSSLMODE: disable
      PORT: 8765
    ports:
      - "8765:8765"

volumes:
  db_data:
