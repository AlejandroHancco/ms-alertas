<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicados · Upgrade MS</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-logo" src="/logo.png" alt="G&amp;S · Gestión y Sistemas">
      <div class="brand-app"><b>Upgrade MS</b><span class="brand-tag">Comunicados</span></div>
    </div>
    <button class="nav-item active" data-view="mipanel"><span data-ic="home"></span>Inicio</button>
    <button class="nav-item" data-view="comunicados"><span data-ic="notice"></span>Comunicados</button>
    <button class="nav-item" data-view="clientes"><span data-ic="building"></span>Clientes</button>
    <button class="nav-item" data-view="miembros"><span data-ic="team"></span>Miembros</button>
    <button class="nav-item" data-view="perfil"><span data-ic="user"></span>Mi perfil</button>
    <div class="spacer"></div>
    <div class="foot" id="genfoot"></div>
    <button class="nav-item nav-collapse" id="btnCollapse" title="Contraer / expandir menú" aria-label="Contraer menú"><span data-ic="panel"></span>Contraer</button>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="gsearch" id="gsearch">
        <div class="search"><span data-ic="search"></span>
          <input type="text" id="globalSearch" placeholder="Buscar" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="gsResults">
        </div>
        <div class="gsresults" id="gsResults" hidden></div>
      </div>
      <div class="nav-user" id="navUser">
        <button class="nav-profile" id="navProfile" title="Mi perfil" aria-label="Abrir menú de perfil" aria-haspopup="true" aria-expanded="false" onclick="toggleUserMenu(event)">?</button>
        <div class="nav-menu" id="navMenu" hidden></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="/app.js" defer></script>
</body>
</html>
