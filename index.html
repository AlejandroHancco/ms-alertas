<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicados · Upgrade MS</title>
<style>
:root{
  /* Atlassian / Jira — tema claro */
  --bg:#f7f8f9; --surface-1:#ffffff; --surface-2:#f1f2f4; --surface-3:#e5e8ec;
  --line:#dcdfe4; --line-strong:#b3b9c4;
  --text:#292a2e; --text-muted:#626f86; --text-dim:#8590a2;
  --accent:#1c2b42; --accent-hover:#0f1b2d; --accent-deep:#e9eef5; --accent-ink:#ffffff;
  --ok:#216e4e; --ok-bg:#dcfff1; --ok-border:#7ee2b8;
  --warn:#974f0c; --warn-bg:#fff7d6; --warn-border:#f5cd47;
  --danger:#ae2e24; --danger-bg:#ffeceb; --danger-border:#fd9891;
  --info:#0055cc; --info-bg:#e9f2ff; --info-border:#8fb8f6;
  --font-sans:"Charlie Text","Charlie Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace;
  --fs-display:32px;--fs-h1:22px;--fs-h2:15px;--fs-body:14px;--fs-table:13px;--fs-label:12px;--fs-caption:11px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --r-sm:3px;--r-md:6px;--r-lg:8px;--r-full:9999px;
  --shadow-md:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.13);
  --shadow-lg:0 8px 16px rgba(9,30,66,.15),0 0 1px rgba(9,30,66,.31);
  --shadow-focus:0 0 0 2px rgba(28,43,66,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.55}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.caption{font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:500}
.icon{width:20px;height:20px;flex:none;vertical-align:-.15em}.icon-lg{width:24px;height:24px}
img.sublogo{object-fit:contain;border-radius:2px}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:none;box-shadow:var(--shadow-focus);border-color:var(--accent)}
button{font-family:inherit}
input,select,textarea{font-family:inherit;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);padding:9px 11px;font-size:var(--fs-body)}
textarea{resize:vertical;min-height:60px}
::placeholder{color:var(--text-dim)}

/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--surface-1);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:var(--sp-4) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
.brand{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-4);color:var(--text)}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand .icon{color:var(--accent)}
.nav-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);color:var(--text-muted);font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-deep);color:var(--accent-hover)}
.nav-item.active .icon{color:var(--accent-hover)}
.sidebar .spacer{flex:1}
.sidebar .foot{font-size:var(--fs-caption);color:var(--text-dim);padding:0 var(--sp-3)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:15;height:56px;background:var(--surface-1);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5)}
.search{flex:1;display:flex;align-items:center;gap:var(--sp-2);background:var(--surface-1);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 10px;max-width:420px}
/* buscador global estilo Azure (desplegable de objetos) */
.gsearch{position:relative;flex:1;max-width:560px}
.gsearch .search{max-width:none;width:100%;flex:1}
.gsresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface-1);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.16);max-height:min(70vh,540px);overflow:auto;z-index:40;padding:6px 0}
.gsresults[hidden]{display:none}
.gs-group{padding:9px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)}
.gs-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer}
.gs-item:hover,.gs-item.active{background:var(--surface-2)}
.gs-item .icon{flex:none;width:16px;height:16px;color:var(--text-muted)}
.gs-main{flex:1;min-width:0}
.gs-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-name mark{background:var(--accent-deep);color:inherit;padding:0 1px;border-radius:2px}
.gs-sub{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-badge{flex:none;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-deep);color:var(--accent);border:1px solid var(--line)}
.gs-empty{padding:16px 14px;color:var(--text-muted);font-size:13px}
.search:focus-within{border-color:var(--info);box-shadow:var(--shadow-focus)}
.search .icon{color:var(--text-muted)}
.search input{border:none;background:none;flex:1;padding:9px 4px;box-shadow:none!important}
.content{padding:var(--sp-5);max-width:1400px;width:100%}
h1.page{font-size:var(--fs-h1);font-weight:600;margin:0 0 var(--sp-1);letter-spacing:-.01em}
.page-sub{color:var(--text-muted);font-size:var(--fs-body);margin-bottom:var(--sp-5)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--sp-2);border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:var(--fs-label);cursor:pointer}
.btn:hover{background:var(--surface-3);border-color:var(--line-strong)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger);border-color:var(--danger-border)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{padding:5px 9px;font-size:var(--fs-caption)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-icon{padding:7px;border-radius:var(--r-sm)}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-5)}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-1);box-shadow:var(--shadow-md)}
.kpi--ok{border-left-color:var(--ok)}.kpi--warn{border-left-color:var(--warn)}.kpi--danger{border-left-color:var(--danger)}.kpi--info{border-left-color:var(--info)}
.kpi-sep{border:none;align-self:stretch;width:1px;background:var(--line);margin:0 var(--sp-1);padding:0}
@media(max-width:900px){.kpi-sep{display:none}}
.kpi-value{font-family:var(--font-mono);font-size:var(--fs-display);font-weight:700;line-height:1.1}
.kpi-label{font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}

/* cards / charts */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-5)}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);box-shadow:var(--shadow-md)}
.card__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.card__title{font-size:var(--fs-h2);font-weight:600;display:flex;align-items:center;gap:var(--sp-2)}
.card__title .icon{color:var(--text-muted)}
.donut-wrap{display:flex;align-items:center;gap:var(--sp-5);flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:var(--sp-2)}
.legend div{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-table);color:var(--text-muted)}
.dot{width:10px;height:10px;border-radius:var(--r-full);flex:none}
.legend b{color:var(--text);font-family:var(--font-mono)}
.bar-row{display:grid;grid-template-columns:160px 1fr 46px;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2);font-size:var(--fs-table)}
.bar-label{color:var(--text-muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{background:var(--surface-2);border-radius:var(--r-sm);height:20px;overflow:hidden;position:relative}
.bar-fill{background:var(--accent);height:100%;border-radius:var(--r-sm);transition:width .4s ease-out}
.bar-outer{height:100%;background:var(--accent);border-radius:var(--r-sm);overflow:hidden;transition:width .4s ease-out}
.bar-outer .rev{height:100%;background:var(--ok);transition:width .4s ease-out}
.bar-val{font-family:var(--font-mono);text-align:right}
.bar-row.clickable{cursor:pointer;padding:2px 4px;margin:0 -4px 6px;border-radius:var(--r-sm)}
.bar-row.clickable:hover{background:var(--surface-2)}
.kpi.clickable{cursor:pointer;position:relative;transition:border-color .15s,background .15s,transform .15s}
.kpi.clickable::after{content:"›";position:absolute;top:var(--sp-3);right:var(--sp-3);color:var(--text-dim);font-size:18px;line-height:1;font-weight:700;transition:color .15s,transform .15s}
.kpi.clickable:hover{border-color:var(--line-strong);background:var(--surface-2);transform:translateY(-1px)}
.kpi.clickable:hover::after{color:var(--accent);transform:translateX(2px)}
@media(prefers-reduced-motion:reduce){.kpi.clickable,.kpi.clickable::after{transition:none}.kpi.clickable:hover{transform:none}.kpi.clickable:hover::after{transform:none}}

/* toolbar estilo Jira: buscador compacto + filtros (izq) · acciones (der) */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.toolbar .search{flex:0 0 260px;width:260px;max-width:260px;height:36px;background:var(--surface-1);border-color:var(--line-strong)}
.toolbar .search.search-lg{flex:1 1 440px;width:auto;max-width:720px}
.toolbar .tb-filters{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2)}
.toolbar select{height:36px;max-width:230px;padding:0 30px 0 12px;font-size:var(--fs-body);background-color:var(--surface-2);border-color:var(--line);border-radius:var(--r-sm);cursor:pointer;font-weight:500;color:var(--text)}
.toolbar select:hover{background-color:var(--surface-3)}
.toolbar .tb-spacer{flex:1 1 auto}
.toolbar .tb-actions{display:flex;align-items:center;gap:var(--sp-2)}
@media(max-width:720px){.toolbar .search{flex-basis:100%;width:100%;max-width:none}.toolbar .tb-actions{flex-basis:100%;justify-content:flex-end}}
.result-count{font-size:var(--fs-caption);color:var(--text-muted);white-space:nowrap;font-weight:600}
.result-count b{color:var(--text);font-family:var(--font-mono)}

/* chip bar (filtro primario por categoría) */
.chipbar{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-3);align-items:center}
.chip{padding:5px 10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--surface-1);color:var(--text-muted);font-size:var(--fs-label);font-weight:600;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip.active{border-color:var(--accent);background:var(--accent-deep);color:var(--accent-hover)}
.chip .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.chip .chip-n{font-family:var(--font-mono);font-size:var(--fs-caption);opacity:.75}
.chipbar .div{width:1px;align-self:stretch;background:var(--line);margin:2px var(--sp-1)}
.chip .icon{width:15px;height:15px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--line-strong);font-size:var(--fs-caption);color:var(--text-muted);max-width:320px}
.fchip .icon{width:14px;height:14px;color:var(--accent);flex:none}
.fchip b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{display:inline-flex;background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px;border-radius:var(--r-sm);flex:none}
.fchip button:hover{background:var(--surface-3);color:var(--danger)}
.fchip button .icon{width:14px;height:14px;color:currentColor}
.chipbar .tb-spacer{flex:1 1 auto}

/* ===== Barra de detalle de comunicado (2 franjas, estilo Jira) ===== */
.det-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:12px}
.det-toolbar .search{height:32px}
.det-toolbar .search.grow{flex:1 1 240px;width:auto;max-width:420px;border:none;background:var(--surface-2)}
.fbtn{position:relative;display:inline-flex;align-items:center;height:32px;border-radius:var(--r-md);flex:none}
.fbtn select{appearance:none;-webkit-appearance:none;background:transparent;border:none;color:var(--text-muted);font-weight:600;height:32px;padding:0 28px 0 10px;max-width:190px;text-overflow:ellipsis;cursor:pointer;border-radius:var(--r-md)}
.fbtn .chev{position:absolute;right:7px;pointer-events:none;color:var(--text-muted);width:16px;height:16px}
.fbtn.active{background:var(--accent-deep)}
.fbtn.active select,.fbtn.active .chev{color:var(--accent)}
.vdiv{width:1px;height:18px;background:var(--line);flex:none}
.det-toolbar .segbar{gap:2px;background:var(--surface-2);border:none;border-radius:var(--r-md);padding:2px;margin:0}
.det-toolbar .seg{width:28px;height:30px;padding:0;justify-content:center;border-radius:var(--r-sm)}
.det-toolbar .seg .icon{width:16px;height:16px}
.det-toolbar .seg.active{background:var(--surface-1);color:var(--accent);box-shadow:var(--shadow-md)}
.btn-icon-ghost{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text-muted);border-radius:var(--r-sm);cursor:pointer;flex:none}
.btn-icon-ghost:hover{background:var(--surface-2);color:var(--text)}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;margin-bottom:12px}
.status-row .chips{display:flex;gap:6px}
.pill{font-size:13px;padding:4px 12px;border-radius:var(--r-full);border:none;background:none;color:var(--text-muted);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.pill:hover{color:var(--text)}
.pill.active{background:var(--surface-2);color:var(--text)}
.pill .chip-n{font-family:var(--font-mono);font-size:11px;opacity:.8}
.status-row .result-count{font-size:12px;color:var(--text-muted)}
.selbar .sel-info{font-size:13px}
.selbar .sel-info b{font-family:var(--font-mono)}
.selbar .sel-acts{display:flex;align-items:center;gap:8px}
/* ===== Página de clientes (tabla con desplegables) ===== */
.clitbl td{vertical-align:middle}
.cli-count{color:var(--text-muted);font-family:var(--font-mono);font-size:13px}
.clirow{cursor:pointer}
.clirow:hover{background:var(--surface-2)}
.clirow.open{background:var(--surface-2)}
.chev-cell{text-align:center}
.chev-ic{display:inline-flex;color:var(--text-muted);transition:transform .15s}
.clirow.open .chev-ic{transform:rotate(90deg);color:var(--accent)}
.clidetail>td{background:var(--surface-2);padding:var(--sp-2) var(--sp-3) var(--sp-3)}
.subtbl{width:100%;border-collapse:collapse;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.subtbl thead th{background:var(--surface-2);color:var(--text-muted);font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.subtbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.subtbl tbody tr:last-child td{border-bottom:none}
.subtbl tbody tr:hover{background:var(--surface-2)}
.subtbl .s-name,.clitbl .s-name{display:flex;align-items:center;gap:var(--sp-3);font-weight:600}
.subtbl .s-name .icon,.clitbl .s-name .icon{flex:none;width:16px;height:16px}
.subtbl .btn-icon-ghost{width:26px;height:26px;flex:none}
.subtbl .btn-icon-ghost.danger:hover{background:var(--danger-bg);color:var(--danger)}
.subtbl .subadd input{height:30px;width:100%;background:var(--surface-2)}
.subtbl .subadd:hover{background:transparent}
.link-ghost{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:var(--fs-label);font-weight:600;padding:4px 6px;border-radius:var(--r-sm)}
.link-ghost:hover{color:var(--accent);text-decoration:underline}
.sincli-foot{margin-top:var(--sp-4)}
/* comunicados que afectan al cliente (dentro del desplegable) */
.cli-coms{margin-top:var(--sp-3)}
.cli-coms-head{display:flex;align-items:center;gap:var(--sp-2);color:var(--text-muted);font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:6px}
.cli-coms-head .icon{width:15px;height:15px;flex:none}
.cli-coms-tbl .clicom-row{cursor:pointer}
.cli-coms-tbl .cc-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag-all{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);background:var(--accent-deep,var(--surface-2));color:var(--accent);border:1px solid var(--accent)}
/* casilla "afecta a todo Azure" en el formulario de comunicado */
.afecta-all{display:flex;align-items:center;gap:var(--sp-3);padding:10px 12px;margin-bottom:var(--sp-4);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer}
.afecta-all input{width:17px;height:17px;flex:none;cursor:pointer}
.afecta-all span{font-size:var(--fs-label)}
tr.sel{background:var(--accent-deep)!important}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--accent)}
th.sortable.sorted{color:var(--accent)}
.sarrow{font-size:10px;margin-left:3px;font-family:var(--font-mono)}

/* badge de categoría con color (tabla) */
.cbadge{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption);font-weight:600;padding:3px 9px;border-radius:var(--r-full);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.cbadge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--text-muted));flex:none}

/* comunicado list */
.filters{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4);align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:var(--sp-4)}
.com{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.com:hover{border-color:var(--line-strong)}
.com .r1{display:flex;justify-content:space-between;gap:var(--sp-2);align-items:flex-start}
.com h3{margin:0;font-size:var(--fs-h2);font-weight:600;line-height:1.35}
.com .num{font-family:var(--font-mono);color:var(--text-muted);font-size:var(--fs-caption);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 7px;white-space:nowrap}
.badges{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.badge{font-size:var(--fs-caption);padding:3px 8px;border-radius:var(--r-full);border:1px solid var(--info-border);background:var(--info-bg);color:var(--info);font-weight:600}
.com .desc{color:var(--text-muted);font-size:var(--fs-table)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px var(--sp-3);font-size:var(--fs-caption);color:var(--text-muted)}
.meta b{color:var(--text);font-weight:600}
.prog{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-caption);color:var(--text-muted)}
.prog .track{flex:1;height:6px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.prog .fill{height:100%;background:var(--ok);border-radius:var(--r-full)}
.com .foot{margin-top:auto;display:flex;gap:var(--sp-2);align-items:center}
.status{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-full);font-size:var(--fs-caption);font-weight:600;border:1px solid}
.status--ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border)}
.status--warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.status--danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}

/* deadlines list */
.dl{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:1px solid var(--line)}
.dl:last-child{border:none}
.dl .when{font-family:var(--font-mono);font-size:var(--fs-table);white-space:nowrap}
.dl .t{flex:1;font-size:var(--fs-table);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(1,4,9,.72);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);width:100%;max-width:1180px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:92vh}
.modal.sm{max-width:560px}
.modal.md{max-width:1000px}
.title-edit{font-size:24px;font-weight:600;line-height:1.3;border:none;background:transparent;width:100%;padding:2px 0;color:var(--text);border-bottom:2px solid transparent;border-radius:0}
.title-edit:hover{border-bottom-color:var(--line)}
.title-edit:focus{border-bottom-color:var(--accent);box-shadow:none!important}
textarea.bigtext{min-height:150px}
textarea.medtext{min-height:110px}
.link-list{display:flex;flex-direction:column;gap:6px}
.link-row{display:flex;gap:6px;align-items:center}
.link-row input{flex:1}
.mhead{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:var(--sp-4);align-items:flex-start}
.mhead h2{margin:0;font-size:var(--fs-h1);font-weight:600}
.mhead .sub{color:var(--text-muted);font-size:var(--fs-caption);margin-top:4px}
.mhead .x{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px}
.mhead .x:hover{color:var(--text)}
.mbody{padding:var(--sp-4) var(--sp-5);overflow:auto}
.res-tools{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;margin-bottom:var(--sp-3)}
.res-tools .search{max-width:none;flex:1;min-width:200px}
.countline{font-size:var(--fs-caption);color:var(--text-muted);margin-bottom:var(--sp-2)}
.countline b{color:var(--text)}
.tblwrap{overflow:auto;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);max-height:60vh;box-shadow:var(--shadow-md)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-table)}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--text-muted);font-weight:600;font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line-strong);white-space:nowrap}
tbody td{padding:6px var(--sp-3);border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:var(--surface-3)}
td.key{font-family:var(--font-mono);color:var(--accent-hover)}
th.key{color:var(--accent)}
td.empty{color:var(--text-dim)}
td.chk,th.chk{text-align:center;width:38px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
tr.done{background:rgba(63,185,80,.05)}

/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3) var(--sp-4)}
/* modal comunicado en 2 columnas (izq: clasificación+inventario · der: redacción) */
.form-2col{display:grid;grid-template-columns:minmax(0,45fr) minmax(0,55fr);gap:var(--sp-5);align-items:start}
.form-2col>.col{display:flex;flex-direction:column;gap:var(--sp-3)}
.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.form-section{font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;padding-bottom:var(--sp-2);margin-bottom:var(--sp-1);border-bottom:1px solid var(--line)}
.col .form-section:not(:first-child){margin-top:var(--sp-4)}
@media(max-width:820px){.form-2col{grid-template-columns:1fr;gap:var(--sp-4)}.field-pair{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:var(--fs-caption);color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.form-foot{display:flex;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-4)}
.comtbl td{white-space:nowrap;vertical-align:middle}
.comtbl tr.rowlink{cursor:pointer}
.comtbl .ctitle{white-space:normal;min-width:300px;max-width:520px}
.comtbl .ctitle b{font-weight:600}
.comtbl .ctitle .comlink{cursor:pointer;color:var(--accent)}
.comtbl .ctitle .comlink:hover{text-decoration:underline;color:var(--accent-hover)}
.cellprog{display:flex;align-items:center;gap:var(--sp-2);min-width:130px}
.cellprog .track{flex:1;height:6px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden}
.cellprog .fill{height:100%;background:var(--warn);border-radius:var(--r-full)}
.cellprog .fill.full{background:var(--ok)}
.acts{display:flex;gap:var(--sp-2);white-space:nowrap}
.back-link{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:var(--fs-label);font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:2px 0;margin-bottom:6px}
.back-link:hover{color:var(--accent)}
.back-link .icon{width:15px;height:15px}
.rechead{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;margin:0 0 3px}
.statstrip{font-size:var(--fs-table);color:var(--text-muted)}
.statstrip b{color:var(--text);font-family:var(--font-mono);font-weight:700}
.statstrip .status{font-size:var(--fs-caption);vertical-align:1px}
.rec-meta{font-size:var(--fs-caption);color:var(--text-muted);margin-bottom:var(--sp-3)}
.rec-fuentes{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:var(--fs-caption);margin:-6px 0 var(--sp-3)}
.rec-fuentes>span{color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.rec-fuentes a{color:var(--info);text-decoration:none;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-fuentes a:hover{text-decoration:underline}
.rec-tools{align-items:center}
.rec-tools .segbar{margin-bottom:0}
.chipbar .fchip .icon{width:13px;height:13px}
.segbar{display:inline-flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;margin-bottom:var(--sp-4)}
.seg{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:none;background:none;color:var(--text-muted);font-weight:600;font-size:var(--fs-label);border-radius:var(--r-sm);cursor:pointer}
.seg .icon{width:16px;height:16px}
.seg:hover{color:var(--text)}
.seg.active{background:var(--surface-1);color:var(--accent);box-shadow:var(--shadow-md)}
.seg.active .icon{color:var(--accent-hover)}
.formerr{background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-table);margin-top:var(--sp-3);white-space:normal;line-height:1.4}
.upload-note{font-size:var(--fs-caption);color:var(--text-muted);text-transform:none;letter-spacing:0;line-height:1.5;margin-top:5px}
.upload-note a{cursor:pointer}
input[type=file]{padding:8px;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:var(--r-sm);width:100%;color:var(--text-muted);font-size:var(--fs-table)}
.empty-state{color:var(--text-muted);text-align:center;padding:var(--sp-6)}
mark{background:#fff0b3;color:#172b4d;border-radius:2px;padding:0 1px}
.hidden{display:none}
/* ===== Panel KQL (query de Resource Graph por comunicado) ===== */
.kql-box{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-1);box-shadow:var(--shadow-md);margin-bottom:var(--sp-4);overflow:hidden}
.kql-head{display:flex;align-items:center;gap:var(--sp-2);padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.kql-head .kql-title{display:flex;align-items:center;gap:6px;font-weight:600;font-size:var(--fs-label);color:var(--text)}
.kql-head .kql-title .icon{color:var(--accent);width:16px;height:16px}
.kql-head .kql-acts{margin-left:auto;display:flex;gap:6px}
.kql-code{margin:0;padding:12px;font-family:var(--font-mono);font-size:var(--fs-table);line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text);max-height:220px;overflow:auto;background:var(--surface-1)}
.kql-empty{padding:12px;color:var(--text-muted);font-size:var(--fs-table);display:flex;align-items:center;gap:8px}
.kql-edit{padding:12px;display:flex;flex-direction:column;gap:8px}
.kql-edit textarea{font-family:var(--font-mono);font-size:var(--fs-table);min-height:120px;background:var(--surface-2)}
.kql-edit .form-foot{margin-top:0}
/* Historial de inventarios (compacto: chips con reloj + fecha) */
.inv-hist{margin-bottom:var(--sp-4)}
.inv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inv-label{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:var(--fs-label);color:var(--text-muted);white-space:nowrap}
.inv-label .icon{width:16px;height:16px;color:var(--accent)}
.inv-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto}
.inv-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--surface-1);color:var(--text-muted);font-size:var(--fs-label);font-weight:600;cursor:pointer;font-family:var(--font-mono)}
.inv-chip .icon{width:14px;height:14px}
.inv-chip:hover{border-color:var(--line-strong);color:var(--text)}
.inv-chip.active{border-color:var(--accent);background:var(--accent-deep);color:var(--accent-hover)}
.inv-panel{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-1);box-shadow:var(--shadow-md);overflow:hidden}
.inv-panel-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.inv-panel-head .inv-acts{margin-left:auto;display:flex;gap:6px}
.inv-panel .kql-code,.inv-panel .kql-empty,.inv-panel .kql-edit{border:none}
.revpills{display:flex;gap:2px;align-items:center;flex:none}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface-3);border:1px solid var(--line-strong);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:12px 16px;box-shadow:var(--shadow-lg);z-index:100;font-size:var(--fs-table);opacity:0;transform:translateY(8px);transition:.2s}
.toast.show{opacity:1;transform:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span id="brandIcon"></span><b>Upgrade MS</b></div>
    <button class="nav-item active" data-view="dashboard"><span data-ic="dashboard"></span>Dashboard</button>
    <button class="nav-item" data-view="comunicados"><span data-ic="notice"></span>Comunicados</button>
    <button class="nav-item" data-view="clientes"><span data-ic="building"></span>Clientes</button>
    <button class="nav-item" data-view="miembros"><span data-ic="team"></span>Miembros</button>
    <div class="spacer"></div>
    <div class="foot" id="genfoot"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="gsearch" id="gsearch">
        <div class="search"><span data-ic="search"></span>
          <input type="text" id="globalSearch" placeholder="Buscar cliente, encargado, comunicado…" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="gsResults">
        </div>
        <div class="gsresults" id="gsResults" hidden></div>
      </div>
      <button class="btn primary" id="btnNew"><span data-ic="add"></span>Nuevo comunicado</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// ---------- iconos SVG ----------
const IC = {
 dashboard:'<path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/>',
 notice:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 resource:'<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5M3 16l9 5 9-5"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>',
 building:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M14 21V9h4a2 2 0 0 1 2 2v10M3 21h18M7 7h2M7 11h2M7 15h2"/>',
 subscription:'<circle cx="7.5" cy="15.5" r="3.5"/><path d="m10 13 7-7M14 5l3 3 3-3-2-2M15 9l2 2"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
 add:'<path d="M12 5v14M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 filter:'<path d="M3 5h18l-7 8v6l-4-2v-4L3 5Z"/>',
 export:'<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
 warning:'<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v5M12 18h.01"/>',
 close:'<path d="M6 6l12 12M18 6 6 18"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.9 4.66A10.4 10.4 0 0 1 12 4.5c6.5 0 10 7 10 7a17.8 17.8 0 0 1-3.06 3.94M6.1 6.12A17.8 17.8 0 0 0 2 11.5s3.5 7 10 7a10.4 10.4 0 0 0 3.06-.44"/>',
 chev:'<path d="m9 6 6 6-6 6"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 sat:'<path d="m6 10 4 4M9.5 6.5l8 8M4 12l-1.5 1.5a2.1 2.1 0 0 0 0 3l2 2a2.1 2.1 0 0 0 3 0L9 17M14 8l2-2M18 12a4 4 0 0 0-4-4M21 12a7 7 0 0 0-7-7"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 team:'<circle cx="9" cy="8" r="3.4"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M17.5 20a5.5 5.5 0 0 0-3-4.9"/>',
};
function svg(name,cls='icon'){
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[name]||''}</svg>`;
}
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=svg(e.dataset.ic));
document.getElementById('brandIcon').innerHTML=svg('sat','icon icon-lg');

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(url,opt)=>{const r=await fetch(url,opt&&{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error((await r.json()).error||r.status);return r.json();};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function hl(s,q){s=esc(s);if(!q)return s;try{return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');}catch(e){return s;}}
const today=new Date().toISOString().slice(0,10);
function fmtInv(ts){                       // "2026-09-03T10:31:00" -> "3 sep 2026"
  if(!ts)return'';
  const d=new Date(ts.replace(' ','T'));
  if(isNaN(d))return esc(ts.slice(0,10));
  return d.toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'});
}
function invAgo(ts){                        // texto relativo: "hoy", "hace 3 d"
  if(!ts)return'';
  const days=Math.floor((new Date(today)-new Date(ts.slice(0,10)))/864e5);
  return days<=0?'hoy':days===1?'ayer':`hace ${days} d`;
}
function dueClass(d){if(!d)return'';return d<today?'--danger':(d<=new Date(Date.now()+30*864e5).toISOString().slice(0,10)?'--warn':'--ok');}
function pctClass(p){return p>=90?'kpi--ok':p>=50?'kpi--warn':'kpi--danger';}
const CAT_COLORS={"Compute":"#58a6ff","Almacenamiento":"#d29922","Redes":"#2dd4bf","Bases de datos":"#a78bfa","Datos y Analítica":"#f778ba","Contenedores":"#3fb950","Seguridad e Identidad":"#f85149","Gobernanza y Monitoreo":"#79c0ff","FinOps y Reservas":"#e3b341","Otros":"#8b98a9"};
function catColor(c){return CAT_COLORS[c]||"#8b98a9";}
function catBadge(c){return c?`<span class="cbadge" style="--c:${catColor(c)}">${esc(c)}</span>`:'<span class="caption">—</span>';}

let STATE={view:'dashboard',stats:null,comunicados:[],q:'',cat:'',est:'faltan',verVenc:false,recSort:{col:null,dir:1}};

async function loadAll(){
  const [st,co,cl,mi]=await Promise.all([api('/api/stats'),api('/api/comunicados'),
    api('/api/clientes').catch(()=>[]),api('/api/miembros').catch(()=>[])]);
  STATE.stats=st;STATE.comunicados=co;CLI.list=cl;MIEM.list=mi;   // caché para el buscador global
  CLI.coms={};   // invalida los comunicados por cliente: pudieron cambiar
  $('#genfoot').textContent='Base local · '+STATE.comunicados.length+' comunicados';
}

// ---------- enrutado (URLs reales / History API) ----------
function navigate(path){
  if(location.pathname!==path)history.pushState({},'',path);
  route();
}
async function route(){
  const p=location.pathname.replace(/\/+$/,'')||'/';
  let m;
  if(m=p.match(/^\/comunicados\/(\d+)\/recursos$/)){
    setNav('comunicados');
    await loadRecursos(+m[1]);           // carga recursos del comunicado
    if(!RES.com){navigate('/comunicados');return;}
    STATE.view='recursos';render();
  }else if(p==='/comunicados'){
    STATE.view='comunicados';setNav('comunicados');render();
  }else if(p==='/clientes'){
    STATE.view='clientes';setNav('clientes');render();
  }else if(p==='/miembros'){
    STATE.view='miembros';setNav('miembros');render();
  }else{
    STATE.view='dashboard';setNav('dashboard');render();
  }
}
window.addEventListener('popstate',route);

document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{
  navigate(b.dataset.view==='dashboard'?'/':'/'+b.dataset.view);
});
// ---------- buscador global estilo Azure (objetos: cliente, encargado, comunicado…) ----------
const GS={items:[],active:-1,open:false};
function gsSources(q){
  const ql=q.toLowerCase(),out=[];
  // Comunicados (por título, resumen o categoría)
  STATE.comunicados.forEach(c=>{
    if([c.titulo,c.resumen,c.categoria].filter(Boolean).join(' ').toLowerCase().includes(ql))
      out.push({type:'Comunicado',icon:'notice',name:c.titulo||'(sin título)',
        sub:[c.categoria,c.fecha_limite?'vence '+c.fecha_limite:''].filter(Boolean).join(' · '),
        run:()=>openRecursos(c.id)});
  });
  // Clientes y sus suscripciones
  (CLI.list||[]).forEach(c=>{
    if((c.nombre||'').toLowerCase().includes(ql)||(c.ext_id||'').toLowerCase().includes(ql))
      out.push({type:'Cliente',icon:'building',name:c.nombre,
        sub:(c.suscripciones?.length||0)+' suscripción(es)'+(c.ext_id?' · '+c.ext_id:''),
        run:()=>gotoCli(c.nombre)});
    (c.suscripciones||[]).forEach(s=>{
      if((s.nombre||'').toLowerCase().includes(ql)||(s.sub_id||'').toLowerCase().includes(ql))
        out.push({type:'Suscripción',icon:'subscription',name:s.nombre||s.sub_id||'(sin nombre)',
          sub:'Cliente: '+c.nombre,run:()=>gotoCli(s.nombre||s.sub_id||c.nombre)});
    });
  });
  // Miembros de la plataforma
  (MIEM.list||[]).forEach(m=>{
    const full=[m.nombre,m.apellido].filter(Boolean).join(' ');
    if([m.correo,m.nombre,m.apellido].filter(Boolean).join(' ').toLowerCase().includes(ql))
      out.push({type:'Miembro',icon:'user',name:full||m.correo,
        sub:full?m.correo:'',run:()=>gotoMiembros(m.correo)});
  });
  // Encargados (responsables distintos de los comunicados)
  const enc={};
  STATE.comunicados.forEach(c=>{const r=(c.responsable||'').trim();if(r)enc[r]=(enc[r]||0)+1;});
  Object.keys(enc).filter(r=>r.toLowerCase().includes(ql)).forEach(r=>{
    out.push({type:'Encargado',icon:'building',name:r,sub:enc[r]+' comunicado(s)',
      run:()=>gotoComQ(r)});
  });
  // Categorías
  [...new Set(STATE.comunicados.map(c=>c.categoria).filter(Boolean))]
    .filter(cat=>cat.toLowerCase().includes(ql))
    .forEach(cat=>out.push({type:'Categoría',icon:'filter',name:cat,sub:'Filtrar comunicados',
      run:()=>{STATE.cat=cat;STATE.q='';STATE.est='';STATE.verVenc=true;navigate('/comunicados');}}));
  return out;
}

function gsRender(raw){
  const box=$('#gsResults'),q=(raw||'').trim();
  if(!box)return;
  if(!q){gsClose();return;}
  const order=['Comunicado','Cliente','Suscripción','Miembro','Encargado','Categoría'],perType=6;
  const grouped={};gsSources(q).forEach(it=>(grouped[it.type]=grouped[it.type]||[]).push(it));
  GS.items=[];let html='';
  order.forEach(t=>{
    const arr=(grouped[t]||[]).slice(0,perType);if(!arr.length)return;
    const extra=grouped[t].length>perType?` · ${perType} de ${grouped[t].length}`:'';
    html+=`<div class="gs-group">${t}${extra}</div>`;
    arr.forEach(it=>{
      const idx=GS.items.length;GS.items.push(it);

        <span class="gs-badge">${t}</span></div>`;
    });
  });
  box.innerHTML=html||`<div class="gs-empty">Sin coincidencias para “${esc(q)}”.</div>`;

}
function gsHover(i){GS.active=i;gsSyncActive();}
function gsSyncActive(){document.querySelectorAll('#gsResults .gs-item').forEach(el=>el.classList.toggle('active',+el.dataset.i===GS.active));}
function gsScroll(){const el=document.querySelector(`#gsResults .gs-item[data-i="${GS.active}"]`);if(el)el.scrollIntoView({block:'nearest'});}
function gsPick(i){const it=GS.items[i];if(!it)return;gsClose();$('#globalSearch').value='';it.run();}
function gsClose(){const box=$('#gsResults');if(box){box.hidden=true;box.innerHTML='';}GS.open=false;GS.active=-1;const g=$('#globalSearch');if(g)g.setAttribute('aria-expanded','false');}
$('#globalSearch').addEventListener('input',e=>gsRender(e.target.value));
$('#globalSearch').addEventListener('focus',e=>{if(e.target.value.trim())gsRender(e.target.value);});
$('#globalSearch').addEventListener('keydown',e=>{
  if(!GS.open||!GS.items.length){if(e.key==='Escape')gsClose();return;}
  if(e.key==='ArrowDown'){e.preventDefault();GS.active=Math.min(GS.active+1,GS.items.length-1);gsSyncActive();gsScroll();}
  else if(e.key==='ArrowUp'){e.preventDefault();GS.active=Math.max(GS.active-1,0);gsSyncActive();gsScroll();}
  else if(e.key==='Enter'){e.preventDefault();gsPick(GS.active>=0?GS.active:0);}
  else if(e.key==='Escape'){gsClose();e.target.blur();}
});

// ---------- DASHBOARD ----------
function donut(segs,size=170,stroke=22){
  const r=(size-stroke)/2,C=2*Math.PI*r,cx=size/2,cy=size/2;
  const total=segs.reduce((a,s)=>a+s.value,0)||1;let acc=0;
  const arcs=segs.filter(s=>s.value>0).map(s=>{const f=s.value/total,dash=f*C,rot=acc*360-90;acc+=f;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" transform="rotate(${rot} ${cx} ${cy})"/>`;}).join('');
  const pct=Math.round((segs[0].value/total)*100);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Revisado ${pct}%">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>${arcs}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" dominant-baseline="middle" font-family="var(--font-mono)" font-size="30" font-weight="700" fill="var(--text)">${pct}%</text>
    <text x="${cx}" y="${cy+20}" text-anchor="middle" font-size="10" fill="var(--text-muted)" letter-spacing="1">REVISADO</text></svg>`;
}
function bars(items,max,color='var(--accent)'){
  max=max||Math.max(...items.map(i=>i.value),1);
  return items.map(i=>`<div class="bar-row"><span class="bar-label" title="${esc(i.label)}">${esc(i.label)}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${(i.value/max*100).toFixed(1)}%;${i.color?'background:'+i.color:''}"></div></div>
    <span class="bar-val">${i.value.toLocaleString()}</span></div>`).join('');
}
function splitBar(rev,total,max,clickAttr=''){
  const wTot=(total/max*100).toFixed(1);
  const wRev=total?(rev/total*100).toFixed(1):0;
  return `<div class="bar-track" ${clickAttr}><div class="bar-outer" style="width:${wTot}%"><div class="rev" style="width:${wRev}%"></div></div></div>`;
}
function daysLeft(d){return Math.round((new Date(d)-new Date(today))/864e5);}

function comStatus(c){   // estado simple derivado del avance de revisión
  if(!c.n_recursos||c.n_revisados===0)return 'sin';        // sin revisar
  if(c.n_revisados>=c.n_recursos)return 'done';            // completado
  return 'proc';                                           // en proceso
}
function comMatch(c,q){
  if(STATE.cat&&c.categoria!==STATE.cat)return false;
  const vencido=c.fecha_limite&&c.fecha_limite<today;
  if(vencido&&!STATE.verVenc)return false;                 // por defecto solo vigentes
  const st=comStatus(c);
  if(STATE.est==='faltan'&&st==='done')return false;       // "los que faltan" = no completados
  if((STATE.est==='sin'||STATE.est==='proc'||STATE.est==='done')&&st!==STATE.est)return false;
  if(q){const b=[c.titulo,c.resumen,c.categoria,c.responsable,c.estado,c.archivo].join(' ').toLowerCase();if(!b.includes(q))return false;}
  return true;
}

function renderInvHistory(){

    const active=String(STATE.recInv)===String(inv.id);

function invDetail(inv){

  const q=inv.kql
    ?`<pre class="kql-code">${esc(inv.kql)}</pre>`
    :`<div class="kql-empty">Sin query guardado para este lote. <button class="btn sm" onclick="editInv(${inv.id})">${svg('add')}Añadir query</button></div>`;

function filterInv(id){STATE.recInv=id;STATE.recCli='';STATE.recSub='';STATE.recRG='';render();}
function clearInvFilter(){STATE.recInv='';render();}
function editInv(id){RES.invEditing=id;renderInvHistory();}
function cancelInvEdit(){RES.invEditing=null;renderInvHistory();}
async function saveInvKql(id){
  const kql=$('#invText').value;
  try{
    await api('/api/inventarios/'+id,{method:'PUT',body:JSON.stringify({kql})});
    const inv=RES.invs.find(x=>x.id===id);if(inv)inv.kql=kql;
    RES.invEditing=null;renderInvHistory();toast('Query KQL guardado.');
  }catch(e){toast('Error: '+e.message);}
}
function copyInv(id){
  const inv=RES.invs.find(x=>x.id===id);const t=(inv&&inv.kql)||'';
  navigator.clipboard?.writeText(t).then(()=>toast('Query copiado.'),()=>toast('No se pudo copiar.'));
}
async function delInv(id){
  const inv=RES.invs.find(x=>x.id===id);
  if(!confirm(`¿Eliminar este lote de inventario y sus ${inv?inv.n_recursos:''} recursos?`))return;
  try{
    const r=await api('/api/inventarios/'+id,{method:'DELETE'});
    if(String(STATE.recInv)===String(id))STATE.recInv='';
    await loadRecursos(RES.cid);await refreshCounts();render();
    toast(`Lote eliminado · ${r.recursos_eliminados} recursos.`);
  }catch(e){toast('Error: '+e.message);}

function updateBody(){
  const rows=recFiltered();
  $('#recbody').innerHTML=STATE.recMode==='recurso'?recTable(rows):groupView(STATE.recMode,rows);
  renderRevPills();
  renderStatusRow();
}
function renderRevPills(){
  const el=$('#revPills');if(!el)return;
  const base=recStructural();const nBase=base.length,nRev=base.filter(r=>r.revisado).length,nPend=nBase-nRev;
  el.innerHTML=`
    <button class="pill ${STATE.recRev===''?'active':''}" aria-pressed="${STATE.recRev===''}" onclick="setRecRev('')">Todos <span class="chip-n">${nBase}</span></button>
    <button class="pill ${STATE.recRev==='pend'?'active':''}" aria-pressed="${STATE.recRev==='pend'}" onclick="setRecRev('pend')">Pendientes <span class="chip-n">${nPend}</span></button>
    <button class="pill ${STATE.recRev==='rev'?'active':''}" aria-pressed="${STATE.recRev==='rev'}" onclick="setRecRev('rev')">Revisados <span class="chip-n">${nRev}</span></button>`;
}
function renderStatusRow(){
  const el=$('#statusRow');if(!el)return;
  const sel=RES.selected.size;
  if(sel>0){
    el.className='status-row selbar';
    el.innerHTML=`<div class="sel-info"><b>${sel}</b> seleccionado${sel>1?'s':''}</div>
      <div class="sel-acts">
        <button class="btn sm" onclick="markSelected(true)">${svg('check')}Marcar revisado</button>
        <button class="btn sm danger" onclick="markSelected(false)">Quitar</button>
        <button class="link-ghost" onclick="clearSelection()">Limpiar selección</button>
      </div>`;
    return;
  }
  el.className='status-row';
  const rows=recFiltered();
  el.innerHTML=`<span class="result-count">Mostrando ${rows.length} recurso(s)</span>`;
}
function toggleSelect(id,cb){
  if(cb.checked)RES.selected.add(id);else RES.selected.delete(id);
  cb.closest('tr').classList.toggle('sel',cb.checked);
  const rows=recFiltered();
  const h=document.querySelector('#recbody thead .chk input');
  if(h)h.checked=rows.length>0&&rows.every(r=>RES.selected.has(r.id));
  renderStatusRow();
}
function selectAllVisible(on){
  recFiltered().forEach(r=>on?RES.selected.add(r.id):RES.selected.delete(r.id));
  updateBody();
}
function clearSelection(){RES.selected.clear();updateBody();}
function markSelected(val){reviewIds([...RES.selected],val);}   // reviewIds → render() limpia la selección
function groupView(by,rows){
  const noneLbl=by==='cliente'?'(sin cliente)':by==='suscripcion'?'(sin suscripción)':'(sin RG)';
  const keyOf=r=>(by==='cliente'?(r.cliente||'(sin cliente)'):by==='suscripcion'?r.suscripcion:r.grupo_recurso)||noneLbl;
  const map=new Map();
  rows.forEach(r=>{
    const key=keyOf(r);
    let g=map.get(key);if(!g){g={key,n:0,rev:0,ids:[],subs:new Set(),rgs:new Set()};map.set(key,g);}
    g.n++;if(r.revisado)g.rev++;g.ids.push(r.id);
    if(r.suscripcion)g.subs.add(r.suscripcion);if(r.grupo_recurso)g.rgs.add(r.grupo_recurso);
  });
  const keyCol=by==='cliente'?'cliente':by==='suscripcion'?'suscripcion':'grupo_recurso';
  let groups=[...map.values()].sort((a,b)=>b.n-a.n);   // por defecto: por cantidad desc
  if(STATE.recSort.col===keyCol)  // orden alfabético si se pidió por esa columna
    groups.sort((a,b)=>a.key.localeCompare(b.key,'es',{numeric:true,sensitivity:'base'})*STATE.recSort.dir);
  RES._groups=groups;RES._groupBy=by;
  const hdr2=by==='cliente'?'Suscripciones':by==='suscripcion'?'RG afectados':'Suscripción';
  const trs=groups.map((g,i)=>{
    const pct=Math.round(g.rev/g.n*100);
    const second=by==='cliente'?`<span class="mono">${g.subs.size}</span> susc`
      :by==='suscripcion'?`<span class="mono">${g.rgs.size}</span> RG`
      :`<span title="${esc([...g.subs].join(', '))}">${esc([...g.subs].join(', ')||'—')}</span>`;
    return `<tr>
      <td class="key">${esc(g.key)}</td>
      <td>${second}</td>
      <td><div class="cellprog"><div class="track"><div class="fill ${pct===100?'full':''}" style="width:${pct}%"></div></div><span class="mono">${g.rev}/${g.n}</span></div></td>
      <td><div class="acts">
        <button class="btn sm" onclick="drillIdx(${i})">${svg(by==='cliente'?'subscription':'resource')}Ver</button>
        <button class="btn sm" onclick="reviewIdx(${i},true)" ${g.rev===g.n?'disabled':''}>${svg('check')}Revisar</button>
        <button class="btn sm" onclick="reviewIdx(${i},false)" ${g.rev===0?'disabled':''}>Quitar</button>
      </div></td></tr>`;
  }).join('');
  return `<div class="tblwrap"><table><thead><tr>
    ${sortTh(by==='cliente'?'Cliente':by==='suscripcion'?'Suscripción':'Grupo de Recurso (RG)',keyCol,'key')}
    <th>${hdr2}</th>
    <th style="width:190px">Revisión</th><th style="width:240px">Acciones</th>
  </tr></thead><tbody>${trs||'<tr><td colspan="4"><div class="empty-state">Sin resultados.</div></td></tr>'}</tbody></table></div>`;
}
function recTable(rows){
  rows=sortRows(rows);
  const allSel=rows.length>0&&rows.every(r=>RES.selected.has(r.id));
  return `<div class="tblwrap"><table>
    <thead><tr><th class="chk"><input type="checkbox" ${allSel?'checked':''} aria-label="Seleccionar todos los recursos visibles" onchange="selectAllVisible(this.checked)"></th>
      ${sortTh('Cliente','cliente','key')}${sortTh('Suscripción','suscripcion','key')}${sortTh('Grupo de Recurso','grupo_recurso','key')}${sortTh('Nombre del Recurso','nombre_recurso','key')}
      <th>Estado</th><th>Gestor</th><th>Añadido</th><th>Revisado por</th></tr></thead>
    <tbody>${rows.map(r=>`<tr class="${r.revisado?'done':''} ${RES.selected.has(r.id)?'sel':''}">
      <td class="chk"><input type="checkbox" ${RES.selected.has(r.id)?'checked':''} aria-label="Seleccionar recurso ${esc(r.nombre_recurso||'')}" onchange="toggleSelect(${r.id},this)"></td>
      <td class="key ${r.cliente?'':'empty'}">${r.cliente?esc(r.cliente):'—'}</td>
      <td class="key ${r.suscripcion?'':'empty'}">${r.suscripcion?esc(r.suscripcion):'—'}</td>
      <td class="key ${r.grupo_recurso?'':'empty'}">${r.grupo_recurso?esc(r.grupo_recurso):'—'}</td>
      <td class="key ${r.nombre_recurso?'':'empty'}">${r.nombre_recurso?esc(r.nombre_recurso):'—'}</td>
      <td class="${r.estado?'':'empty'}">${r.estado?esc(r.estado):'—'}</td>
      <td class="${r.gestor?'':'empty'}">${r.gestor?esc(r.gestor):'—'}</td>
      <td class="${r.created_at?'mono':'empty'}" title="${esc(r.created_at?fmtInv(r.created_at)+' · '+invAgo(r.created_at):'')}">${r.created_at?fmtInv(r.created_at):'—'}</td>
      <td class="${r.revisado_por?'':'empty'}">${r.revisado_por?esc(r.revisado_por)+(r.revisado_at?' · '+r.revisado_at.slice(0,10):''):'—'}</td>
    </tr>`).join('')||'<tr><td colspan="9"><div class="empty-state">Sin recursos con estos filtros.</div></td></tr>'}</tbody></table></div>`;
}
function drillIdx(i){
  const g=RES._groups[i],by=RES._groupBy;
  if(by==='cliente'){STATE.recCli=g.key;STATE.recSub='';STATE.recRG='';STATE.recMode='suscripcion';}   // cliente → sus suscripciones
  else if(by==='suscripcion'){STATE.recSub=g.key;STATE.recRG='';STATE.recMode='recurso';}
  else{STATE.recRG=g.key;STATE.recMode='recurso';}
  render();
}
async function reviewIdx(i,val){await reviewIds(RES._groups[i].ids,val);}
async function toggleRev(id,val){
  await api(`/api/recursos/${id}`,{method:'PATCH',body:JSON.stringify({revisado:val})});
  setLocal(RES.rows.find(x=>x.id===id),val);
  await refreshCounts();updateBody();
}
async function reviewIds(ids,val){
  if(!ids.length)return;
  const res=await api('/api/recursos/bulk-review',{method:'POST',body:JSON.stringify({ids,revisado:val})});
  ids.forEach(id=>{const r=RES.rows.find(x=>x.id===id);if(r)setLocal(r,val);});
  await refreshCounts();render();toast(`${res.actualizados} recurso(s) ${val?'revisados':'sin revisar'}.`);
}
function reviewFiltered(val){reviewIds(recFiltered().map(r=>r.id),val);}
async function refreshCounts(){
  [STATE.stats,STATE.comunicados]=await Promise.all([api('/api/stats'),api('/api/comunicados')]);
}
function exportCSV(){
  const cols=['Cliente','Suscripción','Suscripción ID','Grupo de Recurso','Nombre del Recurso','Estado','Gestor','Añadido (inventario)','Revisado','Revisado por','Notas'];
  const q=v=>`"${(v??'').toString().replace(/"/g,'""')}"`;
  const lines=[cols.map(q).join(',')];
  sortRows(recFiltered()).forEach(r=>lines.push([r.cliente,r.suscripcion,r.suscripcion_id,r.grupo_recurso,r.nombre_recurso,r.estado,r.gestor,(r.created_at||'').slice(0,10),r.revisado?'Sí':'No',r.revisado_por,r.notas].map(q).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`recursos_${RES.cid}.csv`;a.click();
}

async function renderClientes(){
  try{CLI.list=await api('/api/clientes');}catch(e){$('#content').innerHTML=`<div class="empty-state">Error: ${esc(e.message)}</div>`;return;}
  const nsub=CLI.list.reduce((a,c)=>a+c.suscripciones.length,0);
  $('#content').innerHTML=`
    <div class="rechead"><h1 class="page" style="margin:0">Clientes</h1>
      <div class="statstrip"><b>${CLI.list.length}</b> clientes · <b>${nsub}</b> suscripciones</div></div>
    <div class="page-sub">Base de clientes y sus suscripciones. Despliega un cliente para editar sus suscripciones.</div>
    <div class="toolbar">
      <div class="search search-lg"><span>${svg('search')}</span><input id="cliq" placeholder="Buscar cliente, suscripción o id…" oninput="renderCliList()"></div>
      <div class="tb-spacer"></div>
      <div class="tb-actions"><button class="btn primary sm" onclick="openCliForm()">${svg('add')}Nuevo cliente</button></div>
    </div>
    <div class="tblwrap" style="max-height:none"><table class="clitbl">
      <thead><tr><th style="width:34px"></th><th>Cliente</th><th style="width:300px">ID</th><th style="width:88px">Acciones</th></tr></thead>
      <tbody id="cliList"></tbody></table></div>
    <div class="sincli-foot">
      <button class="link-ghost" id="btnSinCli" onclick="toggleSinCliente()">Ver suscripciones sin cliente</button>
      <div id="sinCliBox"></div>
    </div>`;
  SINCLI.open=false;
  if(CLI.pendingQ){const i=$('#cliq');if(i)i.value=CLI.pendingQ;CLI.pendingQ='';}   // filtro traído del buscador global
  renderCliList();
}
let SINCLI={open:false,rows:[]};
async function toggleSinCliente(){
  SINCLI.open=!SINCLI.open;
  const box=$('#sinCliBox'),btn=$('#btnSinCli');
  if(!box)return;
  if(!SINCLI.open){box.innerHTML='';if(btn)btn.textContent='Ver suscripciones sin cliente';return;}
  if(btn)btn.textContent='Ocultar suscripciones sin cliente';
  box.innerHTML='<div class="empty-state" style="padding:var(--sp-4)">Cargando…</div>';
  try{renderSinCli(await api('/api/suscripciones-sin-cliente'));}
  catch(e){box.innerHTML=`<div class="empty-state">Error: ${esc(e.message)}</div>`;}
}
function renderSinCli(l){
  const box=$('#sinCliBox');if(!box)return;
  SINCLI.rows=l;
  if(!l.length){box.innerHTML='<div class="empty-state" style="padding:var(--sp-4)">No hay suscripciones sin cliente. 👌</div>';return;}
  box.innerHTML=`<div class="tblwrap" style="max-height:none;margin-top:8px"><table class="clitbl">
    <thead><tr><th>Suscripción</th><th style="width:300px">ID</th><th style="width:88px">Acciones</th></tr></thead>
    <tbody>${l.map((s,i)=>`<tr>
      <td class="s-name">${svg('subscription','icon')}<span>${esc(s.suscripcion||'(sin nombre)')}</span></td>
      <td class="mono ${s.suscripcion_id?'':'empty'}">${s.suscripcion_id?esc(s.suscripcion_id):'sin id'}</td>
      <td><div class="acts">
        <button class="btn sm btn-icon" title="Editar suscripción" onclick="openSinCliEdit(${i})">${svg('edit')}</button>
        <button class="btn sm btn-icon" title="Asignar a un cliente" onclick="openAsignarCli(${i})">${svg('building')}</button>
      </div></td></tr>`).join('')}</tbody></table></div>`;
}
async function refreshSinCli(){renderSinCli(await api('/api/suscripciones-sin-cliente'));}
function openSinCliEdit(i){
  const s=SINCLI.rows[i];if(!s)return;
  $('#modal').className='modal sm';
  $('#modal').innerHTML=`<div class="mhead"><div><h2>Editar suscripción</h2><div class="sub">Sin cliente asignado</div></div><button class="x" onclick="closeModal()">${svg('close')}</button></div>
    <div class="mbody">
      <div class="field full"><label>Nombre de la suscripción</label><input id="sc_nombre" value="${esc(s.suscripcion||'')}"></div>
      <div class="field full"><label>ID de la suscripción</label><input id="sc_id" class="mono" value="${esc(s.suscripcion_id||'')}"></div>
      <div id="formErr" class="formerr hidden"></div>
      <div class="form-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="doSinCliEdit(${i})">${svg('check')}Guardar</button></div></div>`;
  openModal();setTimeout(()=>$('#sc_nombre')&&$('#sc_nombre').focus(),50);
}
async function doSinCliEdit(i){
  const s=SINCLI.rows[i];if(!s)return;
  const nombre=$('#sc_nombre').value.trim(),sub_id=$('#sc_id').value.trim();
  if(!nombre&&!sub_id){showFormErr('Ingresa el nombre o el id.');return;}
  try{
    const r=await api('/api/suscripciones-sin-cliente',{method:'PUT',body:JSON.stringify(
      {suscripcion:s.suscripcion||'',suscripcion_id:s.suscripcion_id||'',nuevo_nombre:nombre,nuevo_id:sub_id})});
    closeModal();await refreshCli();await refreshSinCli();
    toast('Suscripción actualizada'+(r.recursos_asignados?` · ${r.recursos_asignados} recurso(s) asignados a cliente`:'')+'.');
  }catch(e){showFormErr(esc(e.message));}
}
function openAsignarCli(i){
  const s=SINCLI.rows[i];if(!s)return;
  const opts=CLI.list.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  $('#modal').className='modal sm';
  $('#modal').innerHTML=`<div class="mhead"><div><h2>Asignar cliente</h2><div class="sub">${esc(s.suscripcion||s.suscripcion_id||'(sin nombre)')}</div></div><button class="x" onclick="closeModal()">${svg('close')}</button></div>
    <div class="mbody">
      <div class="field full"><label>Cliente</label>
        <select id="asig_cli" onchange="document.getElementById('asig_new_wrap').classList.toggle('hidden',this.value!=='__new__')">
          <option value="">— Selecciona un cliente —</option>
          ${opts}
          <option value="__new__">➕ Nuevo cliente…</option>
        </select></div>
      <div class="field full hidden" id="asig_new_wrap"><label>Nombre del nuevo cliente</label><input id="asig_new"></div>
      <div id="formErr" class="formerr hidden"></div>
      <div class="form-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="doAsignar(${i})">${svg('check')}Asignar</button></div></div>`;
  openModal();setTimeout(()=>$('#asig_cli')&&$('#asig_cli').focus(),50);
}
async function doAsignar(i){
  const s=SINCLI.rows[i];if(!s)return;
  const sel=$('#asig_cli').value;
  if(!sel){showFormErr('Selecciona un cliente.');return;}
  try{
    let cid;
    if(sel==='__new__'){
      const nombre=$('#asig_new').value.trim();
      if(!nombre){showFormErr('Escribe el nombre del nuevo cliente.');return;}
      cid=(await api('/api/clientes',{method:'POST',body:JSON.stringify({nombre})})).id;
    }else cid=+sel;
    const r=await api(`/api/clientes/${cid}/suscripciones`,{method:'POST',
      body:JSON.stringify({nombre:s.suscripcion||'',sub_id:s.suscripcion_id||''})});
    closeModal();await refreshCli();await refreshSinCli();
    toast('Suscripción asignada'+(r.recursos_asociados?` · ${r.recursos_asociados} recurso(s) asociados`:'')+'.');
  }catch(e){showFormErr(esc(e.message));}
}
function renderCliList(){
  const q=($('#cliq')?.value||'').toLowerCase();
  const list=CLI.list.filter(c=>!q||c.nombre.toLowerCase().includes(q)||c.suscripciones.some(s=>(s.nombre||'').toLowerCase().includes(q)||(s.sub_id||'').toLowerCase().includes(q)));
  const el=$('#cliList');if(!el)return;
  el.innerHTML=list.map(c=>cliRow(c,q)).join('')||'<tr><td colspan="4"><div class="empty-state">Sin clientes que coincidan.</div></td></tr>';
  // carga perezosa de comunicados para los clientes expandidos aún sin caché
  list.forEach(c=>{if((q?true:CLI.expanded.has(c.id))&&CLI.coms[c.id]===undefined)loadCliComs(c.id);});
}
async function loadCliComs(id){
  CLI.coms[id]='loading';   // marca en curso para no re-disparar la carga
  try{CLI.coms[id]=await api(`/api/clientes/${id}/comunicados`);}
  catch(e){CLI.coms[id]={error:e.message};}
  renderCliList();
}
function cliComsHTML(c){
  const d=CLI.coms[c.id];
  const head=`<div class="cli-coms-head">${svg('notice','icon')}Comunicados que le afectan</div>`;
  if(d===undefined||d==='loading')return `<div class="cli-coms">${head}<div class="caption" style="padding:8px 4px">Cargando…</div></div>`;
  if(d.error)return `<div class="cli-coms">${head}<div class="caption" style="padding:8px 4px">Error: ${esc(d.error)}</div></div>`;
  const coms=d.comunicados||[];
  if(!coms.length)return `<div class="cli-coms">${head}<div class="caption" style="padding:8px 4px">Ningún comunicado le afecta todavía.</div></div>`;
  const rows=coms.map(m=>`<tr class="clicom-row" onclick="openRecursos(${m.id})" title="Ver detalle del comunicado">
     <td class="cc-title"><b>${esc(m.titulo||'(sin título)')}</b>${m.es_global?` <span class="tag-all" title="Afecta a todas las suscripciones">Todo Azure</span>`:''}</td>
     <td>${m.categoria?catBadge(m.categoria):''}</td>
     <td class="mono ${m.fecha_limite?'':'empty'}">${m.fecha_limite?esc(m.fecha_limite):'—'}</td>
   </tr>`).join('');
  return `<div class="cli-coms">${head}
    <table class="subtbl cli-coms-tbl"><thead><tr><th>Comunicado</th><th>Categoría</th><th style="width:120px">Fecha límite</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function cliRow(c,q){
  const open=q?true:CLI.expanded.has(c.id);   // al buscar, se expande para ver coincidencias
  const subRows=c.suscripciones.map(s=>`<tr>
      <td class="s-name">${svg('subscription','icon')}<span>${esc(s.nombre||'(sin nombre)')}</span></td>
      <td class="mono ${s.sub_id?'':'empty'}">${s.sub_id?esc(s.sub_id):'sin id'}</td>
      <td><div class="acts">
        <button class="btn-icon-ghost" title="Editar suscripción" onclick="openSubForm(${s.id})">${svg('edit')}</button>
        <button class="btn-icon-ghost danger" title="Quitar suscripción" onclick="delSub(${s.id})">${svg('close')}</button>
      </div></td></tr>`).join('');
  const detail=!open?'':`<tr class="clidetail"><td></td><td colspan="3">
    <table class="subtbl"><thead><tr><th>Suscripción</th><th>ID</th><th style="width:74px"></th></tr></thead>
      <tbody>
        ${subRows||'<tr><td colspan="3" class="caption" style="padding:8px 4px">Sin suscripciones aún.</td></tr>'}
        <tr class="subadd">
          <td><input id="sn_${c.id}" placeholder="Nombre de suscripción"></td>
          <td><input id="si_${c.id}" class="mono" placeholder="ID de la suscripción"></td>
          <td><button class="btn sm" onclick="addSub(${c.id})">${svg('add')}Agregar</button></td>
        </tr>
      </tbody></table>
      ${cliComsHTML(c)}</td></tr>`;
  return `<tr class="clirow ${open?'open':''}" onclick="if(!event.target.closest('.acts'))toggleCli(${c.id})">
    <td class="chev-cell"><span class="chev-ic">${svg('chev','icon')}</span></td>
    <td><b>${hl(c.nombre,q)}</b> <span class="cli-count">(${c.suscripciones.length})</span></td>
    <td class="mono ${c.ext_id?'':'empty'}">${c.ext_id?esc(c.ext_id):'—'}</td>
    <td><div class="acts">
      <button class="btn sm btn-icon" title="Editar cliente" onclick="openCliForm(${c.id})">${svg('edit')}</button>
      <button class="btn sm btn-icon danger" title="Eliminar cliente" onclick="delCli(${c.id})">${svg('trash')}</button>
    </div></td></tr>${detail}`;
}
function toggleCli(id){CLI.expanded.has(id)?CLI.expanded.delete(id):CLI.expanded.add(id);renderCliList();}
async function refreshCli(){CLI.list=await api('/api/clientes');renderCliList();}
async function addSub(cid){
  const nombre=$('#sn_'+cid).value.trim(),sub_id=$('#si_'+cid).value.trim();
  if(!nombre&&!sub_id){toast('Ingresa el nombre o el id de la suscripción.');return;}
  try{const r=await api(`/api/clientes/${cid}/suscripciones`,{method:'POST',body:JSON.stringify({nombre,sub_id})});
    CLI.expanded.add(cid);await refreshCli();toast('Suscripción agregada'+(r.recursos_asociados?` · ${r.recursos_asociados} recursos asociados`:'')+'.');
  }catch(e){toast('Error: '+e.message);}
}
async function delSub(sid){if(!confirm('¿Quitar esta suscripción del cliente?'))return;
  try{await api('/api/suscripciones/'+sid,{method:'DELETE'});await refreshCli();toast('Suscripción quitada.');}catch(e){toast('Error: '+e.message);}}
async function delCli(cid){if(!confirm('¿Eliminar este cliente y todas sus suscripciones?'))return;
  try{await api('/api/clientes/'+cid,{method:'DELETE'});await refreshCli();toast('Cliente eliminado.');}catch(e){toast('Error: '+e.message);}}
function openCliForm(id){
  const c=id?CLI.list.find(x=>x.id===id):null;
  $('#modal').className='modal sm';
  $('#modal').innerHTML=`<div class="mhead"><div><h2>${id?'Editar':'Nuevo'} cliente</h2></div><button class="x" onclick="closeModal()">${svg('close')}</button></div>
    <div class="mbody">
      <div class="field full"><label>Nombre del cliente</label><input id="cli_nombre" value="${c?esc(c.nombre):''}"></div>
      <div class="field full"><label>ID del cliente (tenant)</label><input id="cli_ext" class="mono" value="${c?esc(c.ext_id||''):''}"></div>
      <div id="formErr" class="formerr hidden"></div>
      <div class="form-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="saveCli(${id||0})">${svg('check')}Guardar</button></div></div>`;
  openModal();setTimeout(()=>$('#cli_nombre')&&$('#cli_nombre').focus(),50);
}
async function saveCli(id){
  const nombre=$('#cli_nombre').value.trim(),ext_id=$('#cli_ext').value.trim();
  if(!nombre){showFormErr('El nombre es obligatorio.');return;}
  try{
    if(id)await api('/api/clientes/'+id,{method:'PUT',body:JSON.stringify({nombre,ext_id})});
    else await api('/api/clientes',{method:'POST',body:JSON.stringify({nombre,ext_id})});
    closeModal();toast(id?'Cliente actualizado.':'Cliente creado.');
  }catch(e){showFormErr(esc(e.message));}
}
function openSubForm(sid){
  let sub=null,cli=null;
  for(const c of CLI.list){const s=c.suscripciones.find(x=>x.id===sid);if(s){sub=s;cli=c;break;}}
  if(!sub)return;
  $('#modal').className='modal sm';
  $('#modal').innerHTML=`<div class="mhead"><div><h2>Editar suscripción</h2><div class="sub">Cliente: ${esc(cli.nombre)}</div></div><button class="x" onclick="closeModal()">${svg('close')}</button></div>
    <div class="mbody">
      <div class="field full"><label>Nombre de la suscripción</label><input id="sub_nombre" value="${esc(sub.nombre||'')}"></div>
      <div class="field full"><label>ID de la suscripción</label><input id="sub_id" class="mono" value="${esc(sub.sub_id||'')}"></div>
      <div id="formErr" class="formerr hidden"></div>
      <div class="form-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" onclick="saveSub(${sid},${cli.id})">${svg('check')}Guardar</button></div></div>`;
  openModal();setTimeout(()=>$('#sub_nombre')&&$('#sub_nombre').focus(),50);
}
async function saveSub(sid,cid){
  const nombre=$('#sub_nombre').value.trim(),sub_id=$('#sub_id').value.trim();
  if(!nombre&&!sub_id){showFormErr('Ingresa el nombre o el id.');return;}
  try{const r=await api('/api/suscripciones/'+sid,{method:'PUT',body:JSON.stringify({nombre,sub_id})});
    CLI.expanded.add(cid);closeModal();toast('Suscripción actualizada'+(r.recursos_asociados?` · ${r.recursos_asociados} recursos asociados`:'')+'.');
  }catch(e){showFormErr(esc(e.message));}
}

// ---------- FORM comunicado ----------
const CATS=["Compute","Almacenamiento","Redes","Bases de datos","Datos y Analítica",
 "Contenedores","Seguridad e Identidad","Gobernanza y Monitoreo","FinOps y Reservas","Otros"];
const ESTADOS=["Sin revisar","En proceso","Completado"];
function fuenteRow(val=''){
  return `<div class="link-row"><input class="fuente-link" type="url" placeholder="https://…" value="${esc(val)}">
    <button type="button" class="btn-icon-ghost danger" title="Quitar link" onclick="this.closest('.link-row').remove()">${svg('close')}</button></div>`;
}
function addFuenteLink(val){$('#fuenteLinks')?.insertAdjacentHTML('beforeend',fuenteRow(typeof val==='string'?val:''));}
function getFuente(){return [...document.querySelectorAll('#fuenteLinks .fuente-link')].map(i=>i.value.trim()).filter(Boolean).join('\n');}
const F=[['titulo','Título *'],['categoria','Categoría'],['fecha_recepcion','Fecha recepción'],
 ['fecha_limite','Fecha límite'],['responsable','Responsable'],['estado','Estado'],['fuente','Fuente oficial'],
 ['resumen','Resumen'],['observaciones','Observaciones']];
async function openForm(id){
  let c={};if(id){c=await api('/api/comunicados/'+id);}
  const cur=id?STATE.comunicados.find(x=>x.id===id):null;
  const nRes=cur?cur.n_recursos:0;
  const f=(k,l)=>{
    if(k==='titulo')return '';   // el título va en la cabecera (editable)
    if(k==='categoria'||k==='estado'){
      const val=c[k]||'';
      const opts=k==='categoria'?CATS:ESTADOS;
      const extra=val&&!opts.includes(val)?`<option value="${esc(val)}" selected>${esc(val)}</option>`:'';
      return `<div class="field"><label>${l}</label><select id="f_${k}">
        <option value="">— Selecciona —</option>${extra}
        ${opts.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
    }
    if(k==='fuente'){
      const links=(c[k]||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const rows=(links.length?links:['']).map(fuenteRow).join('');
      return `<div class="field full"><label>${l}</label>
        <div id="fuenteLinks" class="link-list">${rows}</div>
        <button type="button" class="btn sm" style="align-self:flex-start;margin-top:6px" onclick="addFuenteLink()">${svg('add')}Añadir link</button></div>`;
    }
    const long=['resumen','observaciones'].includes(k);const date=k.startsWith('fecha');
    const cls=k==='resumen'?' class="bigtext"':k==='observaciones'?' class="medtext"':'';
    return `<div class="field ${long?'full':''}"><label>${l}</label>${long?`<textarea id="f_${k}"${cls}>${esc(c[k]||'')}</textarea>`:`<input id="f_${k}" ${date?'type="date"':''} value="${esc(c[k]||'')}">`}</div>`;};
  $('#modal').className='modal md';
  $('#modal').innerHTML=`<div class="mhead">
      <div style="flex:1;min-width:0">
        <input id="f_titulo" class="title-edit" placeholder="Nombre del comunicado" value="${esc(c.titulo||'')}">
        <div class="sub">${id?`#${id} · editar comunicado`:'Nuevo comunicado'}</div>
      </div>
      <button class="x" onclick="closeModal()">${svg('close')}</button></div>
    <div class="mbody">
      <label class="afecta-all">
        <input type="checkbox" id="f_afecta_todas" ${c.afecta_todas?'checked':''}>
        <span><b>Afecta a todo Azure</b> — aplica a todas las suscripciones de todos los clientes.</span>
      </label>
      <div class="form-2col">
      <div class="col">
        ${f('categoria','Categoría')}
        <div class="field-pair">${f('fecha_recepcion','Fecha recepción')}${f('fecha_limite','Fecha límite')}</div>
        ${f('responsable','Responsable')}
        ${f('estado','Estado')}
        <div class="form-section">Inventario de recursos</div>
        <div class="field"><label>Archivo — Excel (.xlsx) o CSV</label>
          <input type="file" id="f_file" accept=".csv,.xlsx,.xlsm">
          <div class="upload-note">Debe incluir columnas para
            <b style="color:var(--accent)">Suscripción</b>,
            <b style="color:var(--accent)">Grupo de Recurso (RG)</b> y
            <b style="color:var(--accent)">Nombre del Recurso</b> (variantes como <span class="mono">subscriptionName, resourceGroup, ResourceName…</span>).
            <a onclick="downloadTemplate()">Descargar plantilla CSV</a>.
            Cada carga crea un <b>lote de inventario</b> nuevo con su fecha y query.
          </div>
        </div>
      </div>
      <div class="col">
        ${f('resumen','Resumen')}
        ${f('observaciones','Observaciones')}
        ${f('fuente','Fuente oficial')}
        <div class="field"><label>Query KQL de este inventario (opcional)</label>
          <textarea id="f_kql" class="mono" style="min-height:96px" placeholder="Resources&#10;| where type =~ 'microsoft.compute/virtualmachines'&#10;| project subscriptionId, resourceGroup, name"></textarea>
        </div>
        <div class="field"><label>Nota del lote (opcional)</label>
          <input id="f_nota" placeholder="p. ej. Corrida mensual, alcance ampliado…"></div>
      </div>
    </div>
    <div id="formErr" class="formerr hidden"></div>
    <div class="form-foot"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" id="saveBtn" onclick="saveCom(${id||0})">${svg('check')}Guardar</button></div></div>`;
  openModal();setTimeout(()=>$('#f_titulo')&&$('#f_titulo').focus(),50);
}
function showFormErr(m){const e=$('#formErr');if(e){e.innerHTML=m;e.classList.remove('hidden');}else toast(m);}
function downloadTemplate(){
  const csv='Suscripcion,Grupo de Recurso,Nombre del Recurso,Estado,Gestor\nMi-Suscripcion-Prod,RG-ejemplo,vm-ejemplo-01,Pendiente,Nombre Gestor\n';
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plantilla_recursos.csv';a.click();
}
async function saveCom(id){
  const data={};F.forEach(x=>{if(x[0]==='fuente')return;const el=$('#f_'+x[0]);if(el)data[x[0]]=el.value.trim();});
  data.fuente=getFuente();
  data.afecta_todas=$('#f_afecta_todas')?.checked?1:0;
  if(!data.titulo){showFormErr('El título (nombre del comunicado) es obligatorio.');return;}
  const file=$('#f_file').files[0];
  const replace=$('#f_replace')?.checked;
  const kql=$('#f_kql')?.value||'';
  const nota=$('#f_nota')?.value||'';
  const btn=$('#saveBtn');btn.disabled=true;
  try{
    let cid=id;
    if(id) await api('/api/comunicados/'+id,{method:'PUT',body:JSON.stringify(data)});
    else cid=(await api('/api/comunicados',{method:'POST',body:JSON.stringify(data)})).id;
    let imported=0;
    if(file){
      const ext=(file.name.split('.').pop()||'').toLowerCase();
      const buf=await file.arrayBuffer();
      const qs=[]; if(replace)qs.push('replace=1');
      if(kql.trim())qs.push('kql='+encodeURIComponent(kql));
      if(nota.trim())qs.push('nota='+encodeURIComponent(nota));
      const r=await fetch(`/api/comunicados/${cid}/import`+(qs.length?'?'+qs.join('&'):''),{method:'POST',headers:{'X-Ext':ext},body:buf});
      const j=await r.json();
      if(!r.ok){
        await loadAll();
        showFormErr((id?'Cambios guardados, pero ':'Comunicado creado, pero ')+'el archivo fue <b>rechazado</b>:<br>'+esc(j.error));
        btn.disabled=false;return;
      }
      imported=j.importados;
    }
    await loadAll();
    if(STATE.view==='recursos'&&RES.cid===cid)await loadRecursos(cid);
    closeModal();render();
    toast((id?'Comunicado actualizado':'Comunicado creado')+(file?` · ${imported} recursos en un nuevo lote`:'')+'.');
  }catch(e){showFormErr('Error: '+esc(e.message));btn.disabled=false;}
}
async function delCom(id){
  if(!confirm('¿Eliminar este comunicado y todos sus recursos?'))return;
  await api('/api/comunicados/'+id,{method:'DELETE'});
  await loadAll();render();toast('Comunicado eliminado.');
}

// ---------- modal helpers ----------
function openModal(){$('#overlay').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){$('#overlay').classList.remove('open');document.body.style.overflow='';render();}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').classList.contains('open'))closeModal();});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t.classList&&t.classList.contains('kpi')&&t.classList.contains('clickable')){e.preventDefault();t.click();}
});

// ---------- init ----------
loadAll().then(route).catch(e=>{$('#content').innerHTML=`<div class="empty-state">No se pudo conectar al servidor.<br>Ejecuta <b>python app.py</b> y abre <b>http://localhost:8765</b>.<br><br>${esc(e.message)}</div>`;});
</script>
